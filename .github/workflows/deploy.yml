name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Migrations"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-taskflow-api-dotnet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/taskflow-ecosystem/taskflow-api-dotnet

            # Sync working tree to the latest main (repo must stay clean; secrets live in /opt/taskflow)
            git fetch origin main
            git reset --hard origin/main

            # Apply EF Core migrations with DIRECT_URL before starting the new image.
            # -T evita que el contenedor consuma el stdin del script (heredoc).
            docker compose build api-dotnet-migrate
            docker compose run --rm -T api-dotnet-migrate

            # Build and deploy only the api-dotnet service
            docker compose up -d --build --no-deps api-dotnet

            # Clean up unused images
            docker image prune -f

            echo "Deployment completed successfully"
          EOF

      - name: Verify health endpoint
        run: |
          sleep 10
          for i in {1..12}; do
            if curl -sf "https://taskflow-api-dotnet.xprad.com/health" | grep -q '"service":"taskflow-api-dotnet"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for health check... attempt $i/12"
            sleep 5
          done
          echo "Health check failed"
          exit 1