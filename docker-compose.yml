services:
  api-csharp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-csharp
    restart: unless-stopped
    env_file:
      - /opt/taskflow/.env.csharp
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:3000
      - ASPNETCORE_ENVIRONMENT=Production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-csharp.rule=Host(`taskflow-api-dotnet.xprad.com`)"
      - "traefik.http.routers.api-csharp.entrypoints=websecure"
      - "traefik.http.routers.api-csharp.tls.certresolver=lets-encrypt"
      - "traefik.http.services.api-csharp.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-csharp.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - public

  api-csharp-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    container_name: taskflow-api-csharp-migrate
    env_file:
      - /opt/taskflow/.env.csharp
    networks:
      - public

networks:
  public:
    external: true